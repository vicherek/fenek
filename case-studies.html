<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case studies — FENEK^^</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #110D08;
            --text:    #F0E6D0;
            --muted:   #7A6848;
            --accent:  #C97D2A;
            --rule:    #241A0F;
        }

        html { font-size: 16px; scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            cursor: none;
            overflow-x: hidden;
        }

        /* ─── CUSTOM CURSOR ─── */
        .cursor-dot {
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            position: fixed; top: 0; left: 0;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform .1s, opacity .2s;
        }

        .cursor-ring {
            width: 32px; height: 32px;
            border: 1px solid rgba(232, 146, 13, .4);
            border-radius: 50%;
            position: fixed; top: 0; left: 0;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width .3s, height .3s, border-color .3s, left .08s, top .08s;
        }

        .cursor-ring.is-hovering {
            width: 52px; height: 52px;
            border-color: var(--accent);
        }

        /* ─── LAYOUT ─── */
        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 56px;
        }

        hr.rule {
            border: none;
            border-top: 1px solid var(--rule);
        }

        /* ─── NAV ─── */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 99;
            background: rgba(17,13,8,.95);
            backdrop-filter: blur(10px);
        }

        .nav-inner {
            max-width: 1100px; margin: 0 auto; padding: 0 56px;
            height: 64px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--rule);
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem; font-weight: 800;
            color: var(--text); text-decoration: none;
            letter-spacing: 0.01em;
        }
        .logo span {
            color: var(--accent);
            display: inline-block;
            transition: transform .3s cubic-bezier(.34,1.56,.64,1);
        }
        .logo:hover span { transform: rotate(15deg) translateY(-2px); }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav-link {
            font-size: 0.8rem; font-weight: 500;
            color: var(--muted); text-decoration: none;
            letter-spacing: 0.04em;
            transition: color .2s;
        }
        .nav-link:hover { color: var(--text); }
        .nav-link.active { color: var(--accent); }

        .nav-cta {
            font-size: 0.8rem; font-weight: 500;
            color: var(--accent); text-decoration: none;
            letter-spacing: 0.04em;
            border: 1px solid var(--accent);
            padding: 7px 18px; border-radius: 2px;
            position: relative; overflow: hidden;
            transition: color .25s;
        }
        .nav-cta::before {
            content: '';
            position: absolute; inset: 0;
            background: var(--accent);
            transform: translateX(-101%);
            transition: transform .25s cubic-bezier(.16,1,.3,1);
        }
        .nav-cta:hover::before { transform: translateX(0); }
        .nav-cta:hover { color: var(--bg); }
        .nav-cta span { position: relative; z-index: 1; }

        /* ─── SCROLL PROGRESS BAR ─── */
        .progress-bar {
            position: fixed;
            top: 64px; left: 0;
            height: 1px;
            background: var(--accent);
            width: 0%;
            z-index: 100;
            transition: width .05s linear;
            opacity: .7;
        }

        /* ─── PAGE HEADER ─── */
        .page-header {
            padding: 140px 0 80px;
        }

        .page-label {
            font-size: 0.68rem; font-weight: 500;
            letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--muted); margin-bottom: 24px;
        }

        .page-headline {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.8rem, 5vw, 5rem);
            font-weight: 800; line-height: 1.0;
            letter-spacing: -0.03em;
            color: var(--text);
        }

        .page-headline em {
            font-style: normal;
            color: var(--accent);
        }

        /* ─── SCROLL REVEAL ─── */
        .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ─── PLACEHOLDER ─── */
        .cases-section {
            padding: 0 0 120px;
        }

        .coming-soon {
            padding: 80px 0;
            border-top: 1px solid var(--rule);
        }

        .coming-soon-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.6rem, 2.8vw, 2.4rem);
            font-weight: 800;
            line-height: 1.2;
            color: var(--text);
            max-width: 640px;
        }

        .coming-soon-text em {
            font-style: normal;
            color: var(--accent);
        }

        .coming-soon-fox {
            font-size: 6rem;
            line-height: 1;
            margin-bottom: 48px;
            display: block;
            filter: sepia(20%);
            animation: foxFloat 4s ease-in-out infinite;
        }

        @keyframes foxFloat {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50%       { transform: translateY(-12px) rotate(3deg); }
        }

        /* ─── FOOTER ─── */
        footer {
            border-top: 1px solid var(--rule);
        }

        .footer-inner {
            max-width: 1100px; margin: 0 auto; padding: 0 56px;
            height: 64px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .footer-copy {
            font-size: 0.78rem;
            color: var(--muted);
        }

        .footer-copy a {
            color: var(--muted);
            text-decoration: none;
            transition: color .2s;
        }

        .footer-copy a:hover { color: var(--text); }

    </style>
</head>
<body>

<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div class="progress-bar" id="progressBar"></div>

<!-- NAV -->
<nav>
    <div class="nav-inner">
        <a href="index.html" class="logo">FENEK<span>^^</span></a>
        <div class="nav-links">
            <a href="case-studies.html" class="nav-link active">Case studies</a>
            <a href="mailto:hello@fenekpr.cz" class="nav-cta"><span>Napište nám →</span></a>
        </div>
    </div>
</nav>

<!-- HLAVIČKA -->
<div class="wrap">
    <header class="page-header">
        <p class="page-label">FENEK^^ — Práce, která mluví za sebe</p>
        <h1 class="page-headline">Case<br>studies<em>^^</em></h1>
    </header>
</div>

<hr class="rule">

<!-- PLACEHOLDER -->
<div class="wrap">
    <section class="cases-section">
        <div class="coming-soon reveal">
            <span class="coming-soon-fox">🦊📝</span>
            <p class="coming-soon-text">Case studies teprve připravujeme. Brzy tu najdete příběhy firem, kterým jsme pomohli být <em>vidět</em>.</p>
        </div>
    </section>
</div>

<!-- FOOTER -->
<footer>
    <div class="footer-inner">
        <span class="footer-copy">© 2026 FENEK^^ &nbsp;·&nbsp; IČO: 05948576 &nbsp;·&nbsp; 5. května 794/56, 140 00 Praha 4 – Nusle</span>
        <span class="footer-copy">
            <a href="mailto:hello@fenekpr.cz">hello@fenekpr.cz</a>
            &nbsp;·&nbsp;
            <a href="https://www.linkedin.com/company/fenek/posts/?feedView=all" target="_blank">LinkedIn</a>
        </span>
    </div>
</footer>

<script>
    // ─── CUSTOM CURSOR ───
    const dot  = document.getElementById('cursorDot');
    const ring = document.getElementById('cursorRing');
    let mouseX = 0, mouseY = 0;
    let ringX = 0, ringY = 0;

    document.addEventListener('mousemove', e => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        dot.style.left = mouseX + 'px';
        dot.style.top  = mouseY + 'px';
    });

    function animateRing() {
        ringX += (mouseX - ringX) * 0.15;
        ringY += (mouseY - ringY) * 0.15;
        ring.style.left = ringX + 'px';
        ring.style.top  = ringY + 'px';
        requestAnimationFrame(animateRing);
    }
    animateRing();

    const hoverTargets = document.querySelectorAll('a, button, .case-card');
    hoverTargets.forEach(el => {
        el.addEventListener('mouseenter', () => ring.classList.add('is-hovering'));
        el.addEventListener('mouseleave', () => ring.classList.remove('is-hovering'));
    });

    document.addEventListener('mouseleave', () => {
        dot.style.opacity = '0';
        ring.style.opacity = '0';
    });
    document.addEventListener('mouseenter', () => {
        dot.style.opacity = '1';
        ring.style.opacity = '1';
    });

    // ─── SCROLL PROGRESS BAR ───
    const bar = document.getElementById('progressBar');
    window.addEventListener('scroll', () => {
        const scrolled = window.scrollY;
        const total = document.documentElement.scrollHeight - window.innerHeight;
        bar.style.width = (scrolled / total * 100) + '%';
    });

    // ─── SCROLL REVEAL ───
    const reveals = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

    reveals.forEach(el => observer.observe(el));
</script>

</body>
</html>
